version: 2.1

# Native equivalent of existing GitHub Actions application verification.
jobs:
  application-ci:
    docker:
      - image: cimg/node:24.21.0
      - image: postgres:17-alpine
        environment:
          POSTGRES_DB: live_competition_engine
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
    resource_class: medium
    environment:
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/live_competition_engine
      APP_URL: http://127.0.0.1:3000
    steps:
      - checkout
      - run: npm install
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  security-status-record:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - run: python3 scripts/validate_e2eesa_status.py
workflows:
  required-ci:
    jobs:
      - application-ci
      - security-status-record
